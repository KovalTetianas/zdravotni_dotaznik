<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zdravotní dotazník</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #F2F4F7;
    --surface: #FFFFFF;
    --ink: #1B2230;
    --muted: #5A6373;
    --line: #D3D9E2;
    --accent: #A8201A;
    --accent-ink: #FFFFFF;
    --tint: #F8E8E6;
    --warn: #8A5A00;
    --warn-bg: #FFF4DC;
    --info: #1D3B63;
    --info-bg: #EAF1FB;
    --info-line: #C9D9EF;
    --radius-lg: 14px;
    --radius-sm: 8px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- Language screen ---------- */
  #langScreen { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
  .lang-box { width: 100%; max-width: 440px; }
  .lang-box h1 { font-size: clamp(30px, 7vw, 40px); line-height: 1.1; margin: 0 0 24px; font-weight: 700; letter-spacing: -0.01em; }
  .lang-sub { color: var(--muted); margin: 0 0 28px; line-height: 1.45; }
  .lang-list { display: grid; gap: 10px; }
  .lang-list button {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
    font-size: 18px; font-weight: 500; cursor: pointer; text-align: left;
  }
  .lang-list button:hover { border-color: var(--accent); }
  .lang-list button small { color: var(--muted); font-size: 14px; font-weight: 400; }

  /* ---------- Layout ---------- */
  .wrap { max-width: 800px; margin: 0 auto; padding: 0 16px 64px; }
  header.top {
    display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end;
    padding: 36px 0 24px; border-bottom: 3px solid var(--accent); margin-bottom: 28px;
  }
  header.top h1 { margin: 0; font-size: clamp(28px, 6vw, 38px); line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; }
  .lang-switch { display: flex; gap: 4px; }
  .lang-switch button {
    border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; border-radius: 6px;
    cursor: pointer; font-size: 14px; font-weight: 600; min-width: 42px;
  }
  .lang-switch button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  section.block {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 22px 22px 26px; margin-bottom: 18px;
  }
  .block-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .num {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    background: var(--tint); color: var(--accent); display: grid; place-items: center; font-weight: 700;
  }
  .block-head h2 { margin: 0; font-size: 21px; line-height: 1.25; font-weight: 600; }
  .desc { margin: 0 0 16px; color: var(--muted); max-width: 66ch; }

  .grid { display: grid; gap: 14px 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .field { display: block; }
  .field .lbl, .field > label { display: block; font-size: 14px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--surface); min-height: 46px;
  }
  textarea { min-height: 92px; resize: vertical; line-height: 1.45; }
  select { cursor: pointer; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--tint); }
  input:disabled { background: var(--bg); color: var(--muted); cursor: not-allowed; }

  .q { font-weight: 600; margin: 0 0 10px; max-width: 66ch; }
  .sub { margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--line); }
  .mt { margin-top: 14px; }

  /* Segmented toggles */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--bg); flex-wrap: wrap; }
  .seg label { position: relative; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg span { display: block; padding: 8px 22px; border-radius: 7px; font-weight: 500; min-width: 72px; text-align: center; }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
  .seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  .seg.wide span { min-width: 0; padding: 8px 16px; }

  /* Single-choice list */
  .choices { display: grid; gap: 8px; max-width: 440px; }
  .choices label {
    display: flex; align-items: center; gap: 12px; padding: 11px 14px;
    border: 1px solid var(--line); border-radius: var(--radius-sm); cursor: pointer; background: var(--surface);
  }
  .choices input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; flex: none; }
  .choices label:has(input:checked) { border-color: var(--accent); background: var(--tint); }

  .check { display: inline-flex; align-items: center; gap: 10px; margin-top: 10px; cursor: pointer; }
  .check input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }

  /* Chips (addictions) */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chips button {
    border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 15px;
  }
  .chips button:hover { border-color: var(--accent); }
  .chips button[aria-pressed="true"] { background: var(--tint); border-color: var(--accent); color: var(--accent); }

  /* Repeatable cards */
  .rep-list { display: grid; gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 20px; background: var(--surface); }
  .card .card { background: var(--bg); padding: 14px 16px 16px; }
  .card .card input, .card .card select, .card .card textarea, .card .card .choices label { background: var(--surface); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .card-title { margin: 0; font-size: 17px; font-weight: 600; }
  .card .card .card-title { font-size: 16px; }
  .btn-del {
    border: 1px solid var(--line); background: var(--surface); color: var(--accent);
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;
  }
  .btn-del:hover:not(:disabled) { border-color: var(--accent); }
  .btn-del:disabled { color: var(--muted); opacity: .45; cursor: not-allowed; }
  .btn-add {
    margin-top: 12px; width: 100%; padding: 11px 16px; border-radius: var(--radius-sm);
    border: 1px dashed var(--accent); background: transparent; color: var(--accent); font-weight: 600; cursor: pointer;
  }
  .btn-add:hover { background: var(--tint); }
  .btn-add::before { content: "+ "; }

  /* Age ↔ year pair */
  .agepair + .agepair { margin-top: 22px; }
  .pair {
    display: grid; grid-template-columns: 1fr auto; gap: 14px 18px; align-items: end;
    padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg);
  }
  .age-top { margin-bottom: 4px; }
  .age-out { font-size: 26px; font-weight: 700; line-height: 1.1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .age-out.unset { color: var(--muted); font-weight: 500; font-size: 18px; }
  .scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .year-box { width: 128px; }
  .year-box .lbl { font-size: 13px; color: var(--muted); margin-bottom: 4px; display: block; }
  .year-box input { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .link-mark { font-size: 12px; color: var(--muted); margin-top: 4px; text-align: center; }
  .note { margin: 8px 0 0; font-size: 14px; padding: 8px 12px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); }
  .note:empty { display: none; }

  input[type="range"] { width: 100%; accent-color: var(--accent); height: 28px; margin: 0; cursor: pointer; }
  input[type="range"].unset { opacity: .45; }

  .cig-top { margin-bottom: 6px; }
  .cig-out { font-size: 20px; font-weight: 700; color: var(--accent); }
  .cig-out.unset { color: var(--muted); font-weight: 500; font-size: 17px; }
  .ticks { position: relative; height: 22px; font-size: 13px; color: var(--muted); }
  .ticks span { position: absolute; top: 0; transform: translateX(-50%); }
  .ticks span:first-child { transform: none; }
  .ticks span:last-child { transform: translateX(-100%); }

  /* Month + year */
  .ym { display: grid; grid-template-columns: 96px 1fr; gap: 8px; }

  /* Illness section */
  .exempt { margin: 0 0 16px; }
  .exempt p { margin: 0 0 8px; font-weight: 600; }
  .exempt ul { margin: 0; padding-left: 20px; color: var(--muted); }
  .exempt li { margin-bottom: 6px; }
  .info {
    display: flex; gap: 12px; align-items: flex-start; margin: 0 0 18px; padding: 14px 16px;
    background: var(--info-bg); color: var(--info); border: 1px solid var(--info-line); border-radius: 10px; font-size: 15px;
  }
  .info svg { flex: none; margin-top: 2px; }
  .info p { margin: 0; }

  /* Illness autocomplete */
  .ac, .ac-box { position: relative; }
  .ac-box input { padding-right: 46px; }
  .ac-toggle {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px; border: 0; background: transparent; border-radius: 6px;
    color: var(--muted); cursor: pointer; display: grid; place-items: center;
  }
  .ac-toggle:hover { background: var(--bg); color: var(--ink); }
  .ac-box input[aria-expanded="true"] + .ac-toggle svg { transform: rotate(180deg); }
  .ac-list {
    position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px);
    max-height: min(380px, 60vh); overflow: auto; padding: 0 0 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 12px 32px rgba(27, 34, 48, .16);
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  }
  .ac-group {
    position: sticky; top: 0; z-index: 1; padding: 7px 14px; background: var(--bg);
    font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line);
  }
  .ac-opt { padding: 8px 14px 8px 22px; cursor: pointer; line-height: 1.35; }
  .ac-opt:hover { background: var(--bg); }
  .ac-opt.active { background: var(--tint); }
  .ac-opt[aria-selected="true"] { color: var(--accent); font-weight: 600; }
  .ac-opt mark { background: none; color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
  .ac-sep { border-top: 1px solid var(--line); margin: 6px 0; }
  .ac-other { font-weight: 700; padding-left: 14px; }
  .ac-empty { padding: 12px 14px 4px; color: var(--muted); font-size: 14px; }

  .qa { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .setno {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    margin-top: 20px; padding: 12px 14px; background: var(--bg); border-radius: 10px;
  }
  .setno p { margin: 0; font-size: 15px; }
  .btn-sec {
    border: 1px solid var(--ink); background: var(--surface); padding: 8px 14px;
    border-radius: var(--radius-sm); font-weight: 600; cursor: pointer;
  }
  .btn-sec:hover { background: var(--ink); color: #fff; }

  /* Collapsible sections */
  .block-head h2 { flex: 1; }
  .block-title { flex: 1; }
  .block-toggle {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 0; margin: 0;
    border: 0; background: none; text-align: left; cursor: pointer; color: inherit;
  }
  .chev {
    flex: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center;
    color: var(--muted); transition: transform .2s ease;
  }
  .block-toggle:hover .chev { background: var(--bg); color: var(--ink); }
  .block-toggle[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  .block.collapsed .block-head { margin-bottom: 0; }
  .block.collapsed { padding-bottom: 22px; }
  .block.has-err { border-color: var(--accent); }
  .block.has-err .num { background: var(--accent); color: #fff; }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }

  .card-name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .tag { font-size: 13px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
  .add-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 10px; }
  .rep-list:empty { display: none; }
  .rep-list:empty + .add-row .btn-add { margin-top: 0; }

  /* Instructions */
  .intro { padding: 26px 26px 28px; }
  .intro h2 { margin: 0 0 18px; font-size: 22px; font-weight: 600; }
  .steps { list-style: none; counter-reset: step; margin: 0 0 26px; padding: 0; display: grid; gap: 14px; max-width: 64ch; }
  .steps li { counter-increment: step; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
  .steps li::before {
    content: counter(step); width: 30px; height: 30px; border-radius: 50%;
    background: var(--tint); color: var(--accent); font-weight: 700; display: grid; place-items: center;
  }
  .intro-link { margin: -12px 0 12px; }
  .link-btn { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* Load bar */
  .loadbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    margin: 0 0 18px; padding: 14px 18px; background: var(--surface);
    border: 1px dashed var(--line); border-radius: var(--radius-lg);
  }
  .loadbar p { margin: 0; }
  .loadbar > p:first-child { flex: 1 1 260px; font-weight: 500; }
  .load-msg { flex-basis: 100%; font-size: 14px; color: var(--muted); }
  .load-msg:empty { display: none; }
  .load-msg.ok { color: #1F6B3A; }
  .load-msg.bad { color: var(--accent); }

  /* Dialog */
  dialog {
    border: 0; border-radius: var(--radius-lg); padding: 24px; width: calc(100% - 32px); max-width: 460px;
    color: var(--ink); box-shadow: 0 20px 60px rgba(27, 34, 48, .3);
  }
  dialog::backdrop { background: rgba(27, 34, 48, .45); }
  dialog p { margin: 0 0 20px; font-size: 17px; font-weight: 500; }
  .dlg-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
  .dlg-actions .btn-primary { padding: 10px 18px; font-size: 16px; }


  /* Validation */
  .invalid { border-color: var(--accent) !important; background: #FFF7F6 !important; }
  .err { color: var(--accent); font-size: 14px; margin: 6px 0 0; }
  .form-msg { color: var(--accent); font-weight: 500; margin: 0; }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 28px; }
  .btn-primary {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: var(--radius-sm);
    padding: 14px 26px; font-weight: 600; font-size: 17px; cursor: pointer;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .actions .hint { margin: 0; color: var(--muted); font-size: 14px; }

  @media (max-width: 520px) {
    section.block { padding: 18px 14px 22px; }
    .card { padding: 14px 12px 16px; }
    .pair { grid-template-columns: 1fr; }
    .year-box { width: 100%; }
    .link-mark { text-align: left; }
  }

  .hint-s { display: block; font-size: 13px; color: var(--muted); margin-top: 5px; }
  #printView { display: none; }

  @media print {
    @page { size: A4; margin: 12mm 13mm; }
    html, body { background: #fff; }
    :root { padding: 0; }
    #langScreen, #introScreen, #formScreen, dialog { display: none !important; }
    #printView { display: block; font: 10.5pt/1.35 "Golos Text", Arial, sans-serif; color: #15191F; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pv-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6mm;
      border-bottom: 1.5pt solid #A8201A; padding-bottom: 2mm; margin-bottom: 4mm; }
    .pv-head h1 { font-size: 16pt; margin: 0; }
    .pv-head p { margin: 0; font-size: 9pt; color: #555; white-space: nowrap; }
    .pv-sec { margin: 0 0 4.5mm; }
    .pv-sec h2 { font-size: 11.5pt; margin: 0 0 1mm; break-after: avoid; }
    .pv-sec h2 .n { color: #A8201A; margin-right: 1.5mm; }
    table.pv { width: 100%; border-collapse: collapse; }
    .pv th, .pv td { text-align: left; vertical-align: top; padding: 1.1mm 2mm 1.1mm 0; border-bottom: .4pt solid #D8DCE2; }
    .pv th { font-weight: 400; color: #4A5260; width: 58%; }
    .pv td { font-weight: 600; white-space: pre-wrap; }
    .pv tr { break-inside: avoid; }
    .pv tr.pv-card td { font-weight: 700; color: #A8201A; padding-top: 2.4mm; border-bottom: .8pt solid #E6B8B5; }
    #pdfData { margin-top: 6mm; color: #A3AAB5; font: 5pt/1.3 "Courier New", Courier, monospace; }
    #pdfData p { font: 7pt/1.3 "Golos Text", Arial, sans-serif; margin: 0 0 1mm; }
    .pd-line { white-space: nowrap; }
  }
</style>
</head>
<body>

<div id="langScreen">
  <div class="lang-box">
    <h1>Zdravotní dotazník</h1>
    <div class="lang-list">
      <button type="button" data-lang="cs">Čeština <small>CS</small></button>
      <button type="button" data-lang="uk">Українська <small>UK</small></button>
      <button type="button" data-lang="en">English <small>EN</small></button>
      <button type="button" data-lang="ru">Русский <small>RU</small></button>
    </div>
  </div>
</div>

<div id="introScreen" class="wrap" hidden>
  <header class="top">
    <h1 data-i18n="title"></h1>
    <div class="lang-switch no-print" role="group" aria-label="Language">
      <button type="button" data-lang="cs">CS</button>
      <button type="button" data-lang="uk">UK</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ru">RU</button>
    </div>
  </header>
  <section class="block intro">
    <h2 data-i18n="introTitle"></h2>
    <ol class="steps">
      <li data-i18n="i1"></li>
      <li data-i18n="i2"></li>
      <li data-i18n="i3"></li>
      <li data-i18n="i4"></li>
      <li data-i18n="i5"></li>
    </ol>
    <button type="button" class="btn-primary" id="introNext" data-i18n="next"></button>
  </section>
</div>

<div id="formScreen" class="wrap" hidden>
  <header class="top">
    <h1 data-i18n="title"></h1>
    <div class="lang-switch no-print" role="group" aria-label="Language">
      <button type="button" data-lang="cs">CS</button>
      <button type="button" data-lang="uk">UK</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ru">RU</button>
    </div>
  </header>

  <p class="intro-link no-print"><button type="button" class="link-btn" id="showIntro" data-i18n="showIntro"></button></p>
  <div class="loadbar no-print">
    <p data-i18n="loadText"></p>
    <button type="button" class="btn-sec" id="loadBtn" data-i18n="loadBtn"></button>
    <input type="file" id="loadFile" accept="application/pdf,.pdf" hidden>
    <p class="load-msg" id="loadMsg" role="status"></p>
  </div>

  <form id="form" onsubmit="return false" novalidate>

    <!-- 1 -->
    <section class="block" data-scope data-fixed>
      <div class="block-head"><h2 data-i18n="s1"></h2></div>
      <div class="grid">
        <div class="field"><label for="firstName" data-i18n="firstName"></label><input type="text" id="firstName" autocomplete="given-name"></div>
        <div class="field"><label for="lastName" data-i18n="lastName"></label><input type="text" id="lastName" autocomplete="family-name"></div>
        <div class="field"><label for="birth" data-i18n="birth"></label><input type="date" id="birth" autocomplete="bday"></div>
      </div>
    </section>

    <!-- 2 -->
    <section class="block" data-scope>
      <div class="block-head"><span class="num">1</span><h2 data-i18n="s2"></h2></div>
      <div class="grid">
        <div class="field"><label for="height" data-i18n="height"></label><input type="number" id="height" inputmode="numeric" min="50" max="250" step="1"></div>
        <div class="field"><label for="weight" data-i18n="weight"></label><input type="number" id="weight" inputmode="decimal" min="20" max="300" step="0.1"></div>
      </div>
    </section>

    <!-- 3 -->
    <section class="block" data-scope>
      <div class="block-head"><span class="num">2</span><h2 data-i18n="s3"></h2></div>

/* Mouse wheel must scroll the page, not change numbers in a focused field */
document.addEventListener("wheel", e => {
  const el = document.activeElement;

}, { passive: true });

/* ================= HTML helpers ================= */
function radios(f, opts, cls = "choices", attr = "", pl = "") {
  const n = "r" + (++uid);
  return `<div class="${cls}" role="radiogroup"${pl ? ` data-pl="${pl}"` : ""}>${opts.map(([v, k]) =>
    `<label><input type="radio" name="${n}" value="${v}" data-f="${f}" ${attr}><span data-i18n="${k}"></span></label>`).join("")}</div>`;
}
const yesNo = f => radios(f, [["yes", "yes"], ["no", "no"]], "seg", "data-yn");
const when = (cond, html, cls = "mt") => `<div class="${cls}" data-when="${cond}" hidden>${html}</div>`;
const grid = html => `<div class="grid">${html}</div>`;
const yearF = k => `<label class="field"><span class="lbl" data-i18n="${k}"></span><input type="number" class="yr" inputmode="numeric" min="1900" max="${CY}" data-ph="yearPh"></label>`;
const textF = (k, cls = "", hint = "") => `<label class="field"><span class="lbl" data-i18n="${k}"></span><input type="text" class="${cls}">${hint ? `<span class="hint-s" data-i18n="${hint}"></span>` : ""}</label>`;
const selectF = (k, opts, f = "") => `<label class="field"><span class="lbl" data-i18n="${k}"></span><select${f ? ` data-f="${f}"` : ""}><option value="" data-i18n="selectPh"></option>${opts.map(([v, ok]) => `<option value="${v}" data-i18n="${ok}"></option>`).join("")}</select></label>`;
function ymF(k) {
  const months = Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}">${String(i + 1).padStart(2, "0")}</option>`).join("");
  return `<div class="field"><span class="lbl" data-i18n="${k}"></span><div class="ym"><select><option value="" data-i18n="month"></option>${months}</select><input type="number" class="yr" inputmode="numeric" min="1900" max="${CY}" data-ph="yearPh"></div></div>`;
}

function initRepeater(host) {
  host.dataset.init = "1";
  const cfg = REP[host.dataset.rep];
  const variants = cfg.variants || { main: cfg };
  host.innerHTML = `<div class="rep-list"></div><div class="${cfg.variants ? "add-row" : ""}">${Object.entries(variants).map(([k, v]) =>
    `<button type="button" class="btn-add no-print" data-variant="${k}" data-i18n="${v.add}"></button>`).join("")}</div>`;
  const list = host.firstElementChild;

  const renumber = () => {
    [...list.children].forEach((c, i) => {
      const h = $(":scope > .card-head .card-title", c);
      h.dataset.n = i + 1;
      h.textContent = `${t(cfg.title)} ${i + 1}`;
      $(":scope > .card-head .btn-del", c).disabled = !cfg.free && i === 0;
    });
  };

  const add = (key, focus) => {
    const v = variants[key];
    const card = document.createElement("div");
    card.className = "card " + (v.cls || cfg.cls || "");
    card.dataset.scope = "";
    card.dataset.variant = key;
    card.innerHTML = `<div class="card-head"><div class="card-name"><h3 class="card-title" data-title="${cfg.title}"></h3>${v.tag ? `<span class="tag" data-i18n="${v.tag}"></span>` : ""}</div><button type="button" class="btn-del no-print" data-i18n="del"></button></div>${v.body()}`;
    list.append(card);
    $(":scope > .card-head .btn-del", card).addEventListener("click", () => { card.remove(); renumber(); refreshAll(); });
    initComponents(card);
    translate(card);
    renumber();
    refreshAll();
    if (focus) {
      card.scrollIntoView({ block: "nearest", behavior: "smooth" });
      const f = $("input[type=text], textarea", card);
      if (f) f.focus({ preventScroll: true });
    }
  };

  $$(":scope > div:last-child > .btn-add", host).forEach(b => b.addEventListener("click", () => add(b.dataset.variant, true)));
  host._set = keys => { [...list.children].forEach(c => c.remove()); keys.forEach(k => add(k, false)); };
  if (!cfg.free) add("main", false);
}

function initComponents(root) {
  $$("[data-slot]", root).forEach(el => {
    const [kind, f, opts] = el.dataset.slot.split(":");
    el.outerHTML = kind === "yn" ? yesNo(f) : radios(f, opts.split(",").map(o => o.split("=")));
  });
  $$(".agepair:not([data-init])", root).forEach(buildPair);
  $$("[data-rep]:not([data-init])", root).forEach(initRepeater);
}

/* ================= Translation ================= */
function yearsWord(n) {
  if (lang === "cs") return "let";
  if (lang === "en") return "years";
  const a = n % 10, b = n % 100;
  const f = (a === 1 && b !== 11) ? 0 : (a >= 2 && a <= 4 && (b < 12 || b > 14)) ? 1 : 2;
  return lang === "ru" ? ["год", "года", "лет"][f] : ["рік", "роки", "років"][f];
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dLabel = (id, l = lang) => { const [c, j] = id.split("-").map(Number); return CATS[c].d[j][LI[l]]; };

function translate(root = document) {
  $$("[data-i18n]", root).forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$("[data-ph]", root).forEach(el => { el.placeholder = t(el.dataset.ph); });
  $$("[data-title]", root).forEach(el => { if (el.dataset.n) el.textContent = `${t(el.dataset.title)} ${el.dataset.n}`; });
  $$("[data-cat-name]", root).forEach(el => { el.textContent = cap(CATS[+el.dataset.catName].n[LI[lang]]); });
  $$("[data-d]", root).forEach(el => { el.textContent = dLabel(el.dataset.d); });
}

/* ================= Age ↔ year pairs ================= */
const pairOf = new Map();
function birthYear() {
  const v = $("#birth").value;
  return v ? parseInt(v.slice(0, 4), 10) : null;
}

function buildPair(el) {
  el.dataset.init = "1";
  const lid = "pl" + (++uid);
  el.innerHTML = `
    <p class="q" data-i18n="${el.dataset.q}"></p>
    <div class="pair">
      <div>
        <div class="age-top"><output class="age-out unset"></output></div>
        <input type="range" min="${MIN_AGE}" max="${MAX_AGE}" step="1" value="${MIN_AGE}" class="unset">
        <div class="scale" aria-hidden="true"><span>${MIN_AGE}</span><span>${MAX_AGE}</span></div>
      </div>
      <div class="year-box">
        <span class="lbl" id="${lid}" data-i18n="${el.dataset.yl}"></span>
        <input type="number" inputmode="numeric" min="1900" max="${CY}" aria-labelledby="${lid}" data-ph="yearPh">
        <div class="link-mark no-print" data-i18n="linked"></div>
      </div>
    </div>
    <p class="note" aria-live="polite"></p>`;
  const p = {
    el, range: $("input[type=range]", el), year: $("input[type=number]", el),
    out: $(".age-out", el), note: $(".note", el), ageSet: false
  };
  p.range.addEventListener("input", () => {
    p.ageSet = true;
    const by = birthYear();
    if (by) p.year.value = by + Number(p.range.value);
    refreshAll();
  });
  p.year.addEventListener("input", () => {
    const y = parseInt(p.year.value, 10), by = birthYear();
    if (by && p.year.value.length === 4 && y) {
      const age = y - by;
      if (age >= MIN_AGE && age <= MAX_AGE) { p.range.value = age; p.ageSet = true; } else p.ageSet = false;
    }
    refreshAll();
  });
  pairOf.set(el, p);
}

function refreshPair(p) {
  const by = birthYear(), age = Number(p.range.value), y = parseInt(p.year.value, 10);
  p.out.textContent = p.ageSet ? `${age} ${yearsWord(age)}` : t("notSet");

  let msg = "";

/* ================= Printable summary ================= */
const txt = el => el ? el.textContent.replace(/\s+/g, " ").trim() : "";
const fmtDate = v => { const m = v.match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}.${m[2]}.${m[1]}` : v; };
function fieldLabel(f) { return txt($(".lbl", f) || $(":scope > label", f)).replace(/\s*\*$/, ""); }
function fieldValue(f) {
  const ym = $(".ym", f);
  if (ym) {
    const m = $("select", ym).value, y = $("input", ym).value.trim();
    return m || y ? `${m ? m.padStart(2, "0") : "--"}/${y || "----"}` : "";
  }
  const el = $('input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select, textarea', f);
  if (!el || el.disabled) return null;
  if (el.tagName === "SELECT") return el.value ? el.options[el.selectedIndex].textContent : "";
  if (el.type === "date") return fmtDate(el.value);
  return el.value.trim();
}
function walk(node, rows, depth) {
  let q = null, qPrefix = false;
  for (const c of node.children) {
    if ((c.hidden && !c.classList.contains("block-body")) || c.classList.contains("no-print") ||
        c.matches(".err, .note, .block-head, .card-head, .hint-s")) continue;
    if (c.matches(".q, .desc")) { q = txt(c); qPrefix = c.classList.contains("q-prefix"); continue; }
    if (c.matches('[role="radiogroup"]')) {
      const ch = $("input:checked", c);
      rows.push([q || (c.dataset.pl ? t(c.dataset.pl) : ""), ch ? txt(ch.nextElementSibling) : "", depth]);
      q = null; continue;
    }
    if (c.matches(".agepair")) {
      const p = pairOf.get(c), parts = [];
      if (p.ageSet) parts.push(`${p.range.value} ${yearsWord(Number(p.range.value))}`);
      if (p.year.value) parts.push(`${t(c.dataset.yl).toLowerCase()} ${p.year.value}`);
      rows.push([t(c.dataset.q), parts.join(", "), depth]);
      continue;
    }
    if (c.id === "cigs") { rows.push([q || "", cig.set ? cig.out.textContent : "", depth]); q = null; continue; }
    if (c.matches(".field")) {
      const v = fieldValue(c);
      if (v !== null) { const l = fieldLabel(c); rows.push([qPrefix && q ? `${q}, ${l.toLowerCase()}` : l, v, depth]); }
      q = null; continue;
    }
    if (c.matches(".check")) { if ($("input", c).checked) rows.push([txt(c), t("yes"), depth]); continue; }
    if (c.matches(".card")) {
      const tag = txt($(":scope > .card-head .tag", c));
      rows.push({ card: txt($(":scope > .card-head .card-title", c)) + (tag ? ` (${tag})` : ""), depth });
      walk(c, rows, depth + 1);
      continue;
    }
    walk(c, rows, depth);
  }
}

/* ================= Save / load data embedded in the PDF ================= */
const DATA_VERSION = 1;
const b64enc = s => { let bin = ""; new TextEncoder().encode(s).forEach(b => { bin += String.fromCharCode(b); }); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));
const formFields = () => $$("#form input, #form select, #form textarea");

function collect() {
  const fields = formFields(), vals = {};
  fields.forEach((el, i) => {
    if (el.type === "radio" || el.type === "checkbox") { if (el.checked) vals[i] = 1; }
    else if (el.type !== "range" && el.value) vals[i] = el.value;
  });
  return {
    v: DATA_VERSION, lang, n: fields.length,
    reps: $$("#form [data-rep]").map(h => [...h.firstElementChild.children].map(c => c.dataset.variant)),
    vals,
    ages: $$("#form .agepair").map(el => { const p = pairOf.get(el); return p && p.ageSet ? Number(p.range.value) : null; }),
    cig: cig.set ? Number(cig.range.value) : null,
    dis: $$("#form .card-ill").map(c => c.dataset.disease || "")
  };
}

function fillPdfData() {
  const b = b64enc(JSON.stringify(collect()));
  const lines = [];
  for (let i = 0; i * 100 < b.length; i++) lines.push(`<div class="pd-line">~Q${String(i).padStart(3, "0")}~${b.slice(i * 100, i * 100 + 100)}~</div>`);
  $("#pdfData").innerHTML = `<p>${esc(t("pdfDataNote"))}</p>${lines.join("")}<div class="pd-line">~QEND${lines.length}~</div>`;
}
window.addEventListener("beforeprint", buildPrintView);

function parsePdfText(text) {
  const s = text.replace(/\s+/g, "");
  const end = s.match(/~QEND(\d+)~/);
  if (!end) return null;
  const n = Number(end[1]), parts = [];
  for (const m of s.matchAll(/~Q(\d{3})~([A-Za-z0-9+/=]+)~/g)) parts[Number(m[1])] = m[2];
  for (let i = 0; i < n; i++) if (!parts[i]) return null;
  try { return JSON.parse(b64dec(parts.slice(0, n).join(""))); } catch (err) { return null; }
}

function restore(data) {
  if (!data || data.v !== DATA_VERSION) return false;
  setLang(data.lang || lang);
  $("#formScreen").hidden = false;
  for (let i = 0; i < data.reps.length; i++) {
    const hosts = $$("#form [data-rep]");
    if (!hosts[i]) return false;
    hosts[i]._set(data.reps[i]);
  }
  const fields = formFields();
  if (fields.length !== data.n || $$("#form [data-rep]").length !== data.reps.length) return false;
  fields.forEach((el, i) => {
    const v = data.vals[i];
    if (el.type === "radio" || el.type === "checkbox") el.checked = !!v;
    else if (el.type !== "range") el.value = v ?? "";
  });
  $$("#form .agepair").forEach((el, k) => {
    const p = pairOf.get(el), age = data.ages[k];
    p.ageSet = age != null;
    p.range.value = age != null ? age : MIN_AGE;
  });
  cig.set = data.cig != null;
  cig.range.value = data.cig != null ? data.cig : 0;
  $$("#form .card-ill").forEach((c, k) => { c.dataset.disease = data.dis[k] || ""; });
  $$(".drug-unknown").forEach(cb => { $(".drug-input", cb.closest("[data-scope]")).disabled = cb.checked; });
  $$(".add-type").forEach(i => refreshChips(i.closest("[data-scope]")));
  $$(".err").forEach(e => e.remove());
  $$(".invalid").forEach(e => e.classList.remove("invalid"));
  $$(".has-err").forEach(e => e.classList.remove("has-err"));
  $("#formMsg").textContent = "";
  refreshAll();
  return true;
}

/* pdf.js: first try copies next to index.html (pdf.min.js, pdf.worker.min.js), then the CDN */
const PDFJS_SOURCES = ["./", "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/"];
const loadScript = src => new Promise((res, rej) => {
  const s = document.createElement("script");
  s.src = src; s.onload = res; s.onerror = () => { s.remove(); rej(new Error(src)); };
  document.head.append(s);
});
async function loadPdfJs() {
  if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions.workerSrc) return window.pdfjsLib;
  let lib = window.pdfjsLib || window["pdfjs-dist/build/pdf"];
  for (const base of PDFJS_SOURCES) {
    if (lib) break;
    try { await loadScript(base + "pdf.min.js"); lib = window.pdfjsLib || window["pdfjs-dist/build/pdf"]; } catch (err) { /* try next */ }
  }
  if (!lib) throw new Error("pdf.js not available");
  for (const base of PDFJS_SOURCES) {
    try {
      const r = await fetch(base + "pdf.worker.min.js");
      if (!r.ok) continue;
      lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([await r.text()], { type: "text/javascript" }));
      window.pdfjsLib = lib;
      return lib;
    } catch (err) { /* try next */ }
  }
  throw new Error("pdf.js worker not available");
}
async function pdfText(buf) {
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: buf }).promise;
  let text = "";
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    text += tc.items.map(i => i.str).join("") + "\n";
  }
  return text;
}
function loadMsg(key, cls = "") {
  const m = $("#loadMsg");
  m.dataset.i18n = key;
  m.textContent = t(key);
  m.className = "load-msg " + cls;
}
$("#loadBtn").addEventListener("click", () => $("#loadFile").click());
$("#loadFile").addEventListener("change", async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  loadMsg("loading");
  let text;
  try { text = await pdfText(await file.arrayBuffer()); }
  catch (err) { loadMsg(window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions.workerSrc ? "loadFail" : "loadLibFail", "bad"); return; }
  const data = parsePdfText(text);
  if (!data) { loadMsg("loadFail", "bad"); return; }
  if (!restore(data)) { loadMsg("loadMismatch", "bad"); return; }
  loadMsg("loadOk", "ok");
});
